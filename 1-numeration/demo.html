<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo — conversion binaire</title>
<style>
body{font:16px system-ui;padding:24px;color:#243247}main{max-width:600px;margin:auto}
input,button{font:inherit;padding:10px;border:1px solid #aab7c6;border-radius:7px}
button{background:#2463a6;color:white;border:0;cursor:pointer}#result{margin-top:18px;padding:14px;background:#eef5ff;border-radius:8px}
</style>
<main><h1>Convertisseur binaire → décimal</h1>
<p>Saisissez un nombre composé uniquement de 0 et de 1.</p>
<input id="binary" value="1011" aria-label="Nombre binaire">
<button id="convert">Convertir</button>
<div id="result" aria-live="polite">Résultat : 11</div>
<script>
document.querySelector("#convert").addEventListener("click",()=>{
 const s=document.querySelector("#binary").value.trim();
 const out=document.querySelector("#result");
 if(!/^[01]+$/.test(s)){out.textContent="Veuillez saisir uniquement des 0 et des 1.";return;}
 out.textContent=`${s}₂ = ${parseInt(s,2)}₁₀`;
});
</script></main></html>
