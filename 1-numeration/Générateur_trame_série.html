<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronogramme UART</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#16202e;--mute:#5b6778;--line:#d5dbe3;--trace:#0b5cad;--start:#c0392b;--data:#0b5cad;--par:#b7791f;--stop:#2f855a;--idle:#8a94a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--panel:#18202b;--ink:#e6ebf2;--mute:#97a3b4;--line:#2d3947;--trace:#6cb4ff;--start:#ff7b6b;--data:#6cb4ff;--par:#f0b955;--stop:#5fd39a;--idle:#6b7788;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--panel:#18202b;--ink:#e6ebf2;--mute:#97a3b4;--line:#2d3947;--trace:#6cb4ff;--start:#ff7b6b;--data:#6cb4ff;--par:#f0b955;--stop:#5fd39a;--idle:#6b7788;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.wide{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible{outline:2px solid var(--trace);outline-offset:1px}
.mono{font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace}
#hex{font-size:1.15rem}
.scroll{overflow-x:auto;margin-top:16px;padding:8px 0}
svg{display:block}
svg text{font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace;fill:var(--mute)}
.trace{fill:none;stroke:var(--trace);stroke-width:2.5;stroke-linejoin:miter}
.grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.val{fill:var(--ink)!important;font-size:13px;font-weight:600}
.lab{font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 0}
dl div{border-left:3px solid var(--line);padding-left:10px}
dt{font-size:.8rem;color:var(--mute)}
dd{margin:0;font-weight:600}
h2{font-size:1.1rem;margin:24px 0 8px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--mute);font-weight:600;font-family:"Segoe UI",system-ui,sans-serif}
.err{color:var(--start);margin:12px 0 0;min-height:1.4em}
</style>
</head>
<body>
<main>
<h1>Chronogramme UART</h1>
<p class="sub">Saisissez un ou plusieurs octets (hexadécimal, décimal, binaire ou ASCII) et les paramètres de la liaison : la trame est tracée bit par bit.</p>

<div class="panel">
<form class="grid" id="f" onsubmit="return false">
<label>Format de saisie
<select id="fmt"><option value="hex">Hexadécimal</option><option value="dec">Décimal</option><option value="bin">Binaire</option><option value="asc">ASCII</option></select></label>
<label>Vitesse (bauds)
<select id="baud"><option>300</option><option>600</option><option>1200</option><option>2400</option><option>4800</option><option selected>9600</option><option>14400</option><option>19200</option><option>28800</option><option>38400</option><option>57600</option><option>115200</option><option>230400</option><option>460800</option><option>921600</option></select></label>
<label class="wide"><span id="hexlab">Valeurs hexadécimales, séparées par des espaces (ex. 41 0D)</span>
<input id="hex" class="mono" value="41" autocomplete="off" spellcheck="false"></label>
<label>Bits de données
<select id="nb"><option>5</option><option>6</option><option>7</option><option selected>8</option></select></label>
<label>Parité
<select id="par"><option value="N">Aucune</option><option value="E">Paire</option><option value="O">Impaire</option><option value="M">Mark (toujours 1)</option><option value="S">Space (toujours 0)</option></select></label>
<label>Bits de stop
<select id="stop"><option value="1">1</option><option value="1.5">1,5</option><option value="2">2</option></select></label>
<label>Niveaux
<select id="pol"><option value="ttl">TTL 5 V</option><option value="lv">LVTTL 3,3 V</option><option value="rs">RS-232 ±12 V (signal inversé)</option></select></label>
</form>
<div class="err" id="err" role="alert"></div>
</div>

<div class="panel" style="margin-top:16px">
<div class="scroll"><div id="out"></div></div>
<div class="legend">
<span><i style="background:var(--start)"></i>Start</span>
<span><i style="background:var(--data)"></i>Données (LSB en premier)</span>
<span><i style="background:var(--par)"></i>Parité</span>
<span><i style="background:var(--stop)"></i>Stop</span>
<span><i style="background:var(--idle)"></i>Repos</span>
</div>
<dl id="info"></dl>
<h2>Correspondance des valeurs envoyées</h2>
<div class="scroll"><table id="tab" class="mono"></table></div>
</div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var NS="http://www.w3.org/2000/svg";
function fmt(us){return us>=1000?(us/1000).toFixed(us>=10000?1:2).replace(".",",")+" ms":us.toFixed(1).replace(".",",")+" µs"}
function parse(f,s,nb){
  var b=[],m=(1<<nb)-1;
  if(f==="asc"){
    for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c>m)return{err:"Le caractère « "+s[i]+" » (code "+c+") ne tient pas sur "+nb+" bits."};b.push(c)}
  }else{
    var tk=s.trim().split(/[\s,;]+/).filter(Boolean);
    var re={hex:/^[0-9a-f]+$/i,dec:/^[0-9]+$/,bin:/^[01]+$/}[f],base={hex:16,dec:10,bin:2}[f];
    for(var k=0;k<tk.length;k++){
      var t=tk[k];if(f==="hex")t=t.replace(/^0x/i,"");if(f==="bin")t=t.replace(/^0b/i,"");
      if(!re.test(t))return{err:"« "+tk[k]+" » n’est pas une valeur "+{hex:"hexadécimale",dec:"décimale",bin:"binaire"}[f]+" valide."};
      var v=parseInt(t,base);
      if(v>m)return{err:"« "+tk[k]+" » ("+v+") ne tient pas sur "+nb+" bits (maximum "+m+")."};
      b.push(v);
    }
  }
  if(!b.length)return{err:"Entrez au moins une valeur."};
  if(b.length>8)return{err:"Huit octets au maximum pour garder un tracé lisible."};
  return{b:b};
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function build(){
  var err=$("err");err.textContent="";
  var nb=+$("nb").value,par=$("par").value,stop=+$("stop").value,pol=$("pol").value,inv=pol==="rs",baud=+$("baud").value;
  var r=parse($("fmt").value,$("hex").value,nb);
  if(r.err){err.textContent=r.err;return}
  var bytes=r.b,toks=bytes;
  var Tb=1e6/baud;
  var segs=[{n:"repos",c:"idle",v:1,d:1}];
  bytes.forEach(function(b,bi){
    segs.push({n:"Start",c:"start",v:0,d:1});
    var ones=0;
    for(var i=0;i<nb;i++){var bit=(b>>i)&1;ones+=bit;segs.push({n:"D"+i,c:"data",v:bit,d:1})}
    if(par!=="N"){
      var p=par==="E"?ones%2:par==="O"?1-ones%2:par==="M"?1:0;
      segs.push({n:"P",c:"par",v:p,d:1});
    }
    segs.push({n:"Stop",c:"stop",v:1,d:stop});
  });
  segs.push({n:"repos",c:"idle",v:1,d:1});
  var W=56,H=170,top=44,hi=70,lo=130,x0=76;
  var total=segs.reduce(function(a,s){return a+s.d},0);
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",x0+total*W+14);svg.setAttribute("height",H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Chronogramme UART des octets "+toks.join(" "));
  var h="",x=x0,t=0,path="",yPrev=null,ticks="";
  var Y=function(v){return (inv?!v:!!v)?hi:lo};
  segs.forEach(function(s,i){
    var w=s.d*W,y=Y(s.v);
    h+='<rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+(lo-top+16)+'" fill="var(--'+s.c+')" opacity="'+(s.c==="idle"?".06":".11")+'"/>';
    h+='<line class="grid-l" x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(lo+16)+'"/>';
    h+='<text class="lab" x="'+(x+w/2)+'" y="'+(top-8)+'" text-anchor="middle" style="fill:var(--'+s.c+')">'+s.n+'</text>';
    h+='<text class="val" x="'+(x+w/2)+'" y="'+(top-24)+'" text-anchor="middle">'+s.v+'</text>';
    path+=(yPrev===null?"M"+x+" "+y:(yPrev!==y?" L"+x+" "+yPrev+" L"+x+" "+y:""))+" L"+(x+w)+" "+y;
    yPrev=y;
    ticks+='<text class="lab" x="'+x+'" y="'+(H-4)+'" text-anchor="'+(i===0?"start":"middle")+'">'+(t*Tb<1e4?(t*Tb).toFixed(Tb<5?1:0):((t*Tb)/1000).toFixed(1))+'</text>';
    x+=w;t+=s.d;
  });
  ticks+='<text class="lab" x="'+x+'" y="'+(H-4)+'" text-anchor="end">'+(t*Tb<1e4?(t*Tb).toFixed(Tb<5?1:0):((t*Tb)/1000).toFixed(1))+'</text>';
  h+='<line class="grid-l" x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(lo+16)+'"/>';
  var L={ttl:["+5 V","0 V"],lv:["+3,3 V","0 V"],rs:["+12 V","−12 V"]}[pol];
  h+='<line class="grid-l" x1="'+x0+'" y1="'+hi+'" x2="'+x+'" y2="'+hi+'"/><line class="grid-l" x1="'+x0+'" y1="'+lo+'" x2="'+x+'" y2="'+lo+'"/>';
  if(inv)h+='<line class="grid-l" x1="'+x0+'" y1="'+((hi+lo)/2)+'" x2="'+x+'" y2="'+((hi+lo)/2)+'"/><text class="lab" x="'+(x0-8)+'" y="'+((hi+lo)/2+4)+'" text-anchor="end">0 V</text>';
  h+='<text class="val" x="'+(x0-8)+'" y="'+(hi+4)+'" text-anchor="end">'+L[0]+'</text><text class="lab" x="'+(x0-8)+'" y="'+(hi+17)+'" text-anchor="end">niveau '+(inv?0:1)+'</text>';
  h+='<text class="val" x="'+(x0-8)+'" y="'+(lo+4)+'" text-anchor="end">'+L[1]+'</text><text class="lab" x="'+(x0-8)+'" y="'+(lo+17)+'" text-anchor="end">niveau '+(inv?1:0)+'</text>';
  h+='<line stroke="var(--line)" x1="'+x0+'" y1="'+top+'" x2="'+x0+'" y2="'+(lo+16)+'"/>';
  h+='<path class="trace" d="'+path+'"/>'+ticks;
  h+='<text class="lab" x="'+(x0)+'" y="'+(H-18)+'" style="fill:var(--idle)">temps ('+(t*Tb<1e4?"µs":"ms")+')</text>';
  svg.innerHTML=h;
  $("out").replaceChildren(svg);
  var fb=1+nb+(par==="N"?0:1)+stop,ft=fb*Tb;
  var rows=[
    ["Durée d’un bit",fmt(Tb)],
    ["Bits par trame",String(fb).replace(".",",")+" ("+"1 start + "+nb+" données"+(par==="N"?"":" + 1 parité")+" + "+String(stop).replace(".",",")+" stop)"],
    ["Durée d’une trame",fmt(ft)],
    ["Débit utile",Math.round(baud*nb/fb)+" bit/s ("+(1e6/ft).toFixed(1).replace(".",",")+" octets/s)"],
    ["Niveaux logiques",{ttl:"TTL 5 V",lv:"LVTTL 3,3 V",rs:"RS-232 ±12 V"}[pol]]
  ];
  var NM={0:"NUL",7:"BEL",8:"BS",9:"TAB",10:"LF",13:"CR",27:"ESC",32:"espace",127:"DEL"};
  var asc=function(b){return NM[b]||(b>32&&b<127?String.fromCharCode(b):"–")};
  $("tab").innerHTML="<thead><tr><th>Hexadécimal</th><th>Décimal</th><th>Binaire</th><th>ASCII</th></tr></thead><tbody>"+bytes.map(function(b){return "<tr><td>0x"+b.toString(16).toUpperCase().padStart(2,"0")+"</td><td>"+b+"</td><td>"+b.toString(2).padStart(nb,"0")+"</td><td>"+esc(asc(b))+"</td></tr>"}).join("")+"</tbody>";
  $("info").innerHTML=rows.map(function(r){return "<div><dt>"+r[0]+"</dt><dd class=\"mono\">"+r[1].replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</dd></div>"}).join("");
}
["hex","baud","nb","par","stop","pol"].forEach(function(i){$(i).addEventListener("input",build)});
var prev="hex",LAB={hex:"Valeurs hexadécimales, séparées par des espaces (ex. 41 0D)",dec:"Valeurs décimales, séparées par des espaces (ex. 65 13)",bin:"Valeurs binaires, séparées par des espaces (ex. 01000001)",asc:"Texte ASCII : un caractère = un octet (ex. A)"};
$("fmt").addEventListener("input",function(){
  var f=$("fmt").value,nb=+$("nb").value,r=parse(prev,$("hex").value,nb);
  $("hex").value=r.b?r.b.map(function(v){return f==="hex"?v.toString(16).toUpperCase().padStart(2,"0"):f==="dec"?String(v):f==="bin"?v.toString(2).padStart(nb,"0"):String.fromCharCode(v)}).join(f==="asc"?"":" "):"";
  prev=f;$("hexlab").textContent=LAB[f];build();
});
build();
})();
</script>
</body>
</html>
