<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cours, démonstrations, TP et TD.">
<title>BTS CIEL — option ER</title>
<style>
:root{--navy:#172b46;--blue:#2463a6;--bg:#f3f6fa;--line:#e2e8f0;--muted:#64748b;--panel:#fff;--active:#eaf2fc}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#243247;background:var(--bg)}
header{height:68px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 22px;gap:13px;box-shadow:0 2px 8px #10203330}
.logo{font-size:25px}header h1{font-size:19px;margin:0;font-weight:700}header small{display:block;color:#c6d5e7;font-size:12px}
.menu-btn{background:#ffffff1f;color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;flex:none}
.menu-btn:hover{background:#ffffff33}
.layout{display:grid;grid-template-columns:var(--side,300px) 5px minmax(0,1fr);min-height:calc(100vh - 68px)}
.layout.sidebar-collapsed{grid-template-columns:minmax(0,1fr)}
.layout.sidebar-collapsed aside,.layout.sidebar-collapsed .resizer{display:none}
aside{background:#fff;padding:18px 10px;overflow:auto;min-width:0;position:sticky;top:0;align-self:start;height:calc(100vh - 68px)}
.resizer{cursor:col-resize;background:var(--line);touch-action:none;transition:background .15s}
.resizer:hover,.resizer.drag{background:var(--blue)}
.modes{display:flex;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden;margin:0 0 12px}
.modes[hidden]{display:none}
.modes button{flex:1;border:0;background:#fff;padding:8px 6px;font:inherit;font-size:13px;cursor:pointer;color:#334155}
.modes button+button{border-left:1px solid #cbd5e1}
.modes button.on{background:var(--blue);color:#fff;font-weight:650}
.pickbox{display:grid;gap:10px}
.search{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin:0 0 12px}
.tree ul{list-style:none;margin:0;padding-left:0}
.tree li{margin:1px 0}.tree button{width:100%;border:0;background:transparent;text-align:left;padding:6px 7px;border-radius:7px;font:inherit;color:#334155;cursor:pointer;display:flex;gap:6px;align-items:center}
.tree button:hover{background:#f1f5f9}.tree button.active{background:var(--active);color:#174f8c;font-weight:650}
.ico{width:18px;text-align:center;flex:none}.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree button:focus-visible{background:#f1f5f9;outline:2px solid #8bb4e2;outline-offset:-2px}
.tree .parentbtn{color:#174f8c;font-weight:600}
.navhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 7px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:28px clamp(18px,4vw,54px);min-width:0;max-width:1150px;width:100%;margin:0 auto}
main.wide{max-width:none;margin:0}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:14px}
.welcome,.viewer{background:white;border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,38px);box-shadow:0 4px 18px #1e293b08}
h2{font-size:27px;line-height:1.2;margin:0 0 10px;color:#172b46}
.lead{color:#526174;max-width:720px;margin:0 0 10px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:17px 0 20px}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#24415f;text-decoration:none;font:inherit;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.folder-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.linkbtn{border:0;background:transparent;font:inherit;color:#174f8c;cursor:pointer;padding:5px 2px;text-align:left}.linkbtn:hover{text-decoration:underline}
.content{overflow-wrap:anywhere}.content img{max-width:100%;height:auto}.content pre{overflow:auto;background:#f1f5f9;padding:14px;border-radius:8px}.content code{background:#f1f5f9;padding:2px 4px;border-radius:4px}.content pre code{background:transparent;padding:0}
.content pre.txt{white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:100%;margin:0}
.content table{border-collapse:collapse;width:100%}.content td,.content th{border:1px solid var(--line);padding:8px;text-align:left}
iframe.document{width:100%;height:min(75vh,850px);border:1px solid var(--line);border-radius:8px;background:white}
main.app{max-width:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;height:calc(100vh - 68px)}
main.app .breadcrumb,main.app footer{display:none}
main.app .viewer{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px 14px;align-items:center;padding:8px 12px;border-radius:10px}
main.app h2{font-size:16px;margin:0}
main.app .toolbar{margin:0}
main.app .content{grid-column:1/-1;align-self:stretch;min-height:0;display:flex}
main.app iframe.document{flex:1;height:auto;min-height:0;border-radius:6px}
main.app .player{flex:1;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain}
.player{width:100%;max-height:75vh;background:#000;border-radius:6px;display:block}
.codebox{flex:1;min-width:0;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table.code{border-collapse:collapse;width:100%;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}
table.code td{padding:0;border:0;vertical-align:top}
table.code td.ln{user-select:none;text-align:right;color:#8c959f;padding:0 12px 0 10px;background:#f6f8fa;border-right:1px solid var(--line);position:sticky;left:0;min-width:3.4em}
table.code td.lc{white-space:pre;padding:0 14px}
.hl-com{color:#6e7781;font-style:italic}.hl-str{color:#0a3069}.hl-num{color:#0550ae}.hl-kw{color:#cf222e;font-weight:600}
.hl-ty{color:#953800}.hl-bi{color:#116329}.hl-fn{color:#8250df}.hl-pre{color:#bc4c00}.hl-var{color:#0550ae}.hl-lbl{color:#8250df;font-weight:600}
.linkcard{border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:640px;display:grid;gap:10px}
.linkcard .host{font-weight:700;color:#172b46}.linkcard .url{margin:0;color:var(--muted);font-size:13px;word-break:break-all}
.notice{background:#eff6ff;border-left:4px solid #60a5fa;padding:12px 15px;border-radius:5px;color:#34516e;font-size:13px;margin:0}
.ctxmenu{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #0f172a30;padding:4px;min-width:210px}
.ctxmenu button{display:block;width:100%;border:0;background:transparent;text-align:left;font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer;color:#243247}
.ctxmenu button:hover{background:#f1f5f9}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172b46;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:101}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.resizer{display:none}aside{border-bottom:1px solid var(--line);max-height:48vh;position:static;height:auto}.layout{min-height:calc(100vh - 68px)}main{padding:17px 13px}h2{font-size:23px}.menu-btn span{display:none}}
</style>
</head>
<body>
<header>
  <button id="toggleNav" class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="true" title="Masquer / afficher le menu">☰ <span>Menu</span></button>
  <div class="logo">👨‍💻</div><div><h1>BTS CIEL</h1><small>option ER</small></div>
</header>
<div class="layout" id="layout">
<aside id="sidebar">
  <div class="modes" id="modes" role="group" aria-label="Source des fichiers">
    <button type="button" data-mode="online" title="Lit les fichiers publiés sur GitHub (API GitHub)">🌐 En ligne</button>
    <button type="button" data-mode="local" title="Lit directement les fichiers de votre disque (re-cliquer pour relire le dossier)">💻 Local</button>
  </div>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <input id="search" class="search" type="search" placeholder="Rechercher un cours ou un fichier…" aria-label="Rechercher">
  <nav class="tree" id="tree" aria-label="Arborescence des cours"></nav>
</aside>
<div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Largeur du menu" title="Glisser pour changer la largeur du menu (double-clic : valeur par défaut)"></div>
<main id="main">
  <div class="breadcrumb" id="breadcrumb" hidden></div>
  <section class="welcome" id="welcome">
    <h2>Bienvenue!</h2>
    <p class="lead">Choisissez une séquence dans le panneau de gauche :</p>
    <p class="lead">Vous pouvez consulter les cours et activités, voir des démonstrations et des quiz pour vous entrainer.</p>
    <p class="lead">Tout est téléchargeable.</p>
  </section>
  <section class="viewer" id="viewer" hidden>
    <h2 id="fileTitle"></h2>
    <div class="toolbar" id="toolbar"></div>
    <div class="content" id="content"></div>
  </section>
  <footer>Portail pédagogique • Publié avec GitHub Pages</footer>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* Deux modes (le mode local n'apparaît que si le portail est ouvert depuis le disque ou localhost) :
   - « En ligne » : détection des fichiers via l'API GitHub (le dépôt doit être public).
   - « Local »    : lecture directe d'un dossier de votre disque (sélecteur de dossier du navigateur). */
const repoOwner = "ccazaux";            // propriétaire GitHub
const repoName = "ccazaux.github.io";   // nom du dépôt
let courses = [];
const $ = s => document.querySelector(s);
const icons = {folder:"📁",markdown:"📘",html:"🧪",pdf:"📕",text:"📝",falstad:"⚡",odt:"📃",odp:"📊",code:"📜",video:"🎬",link:"🔗",other:"📄"};
const tree = $("#tree");
const layout = $("#layout"), toggleBtn = $("#toggleNav");

/* ---------- Mode (en ligne / local) ---------- */
const isLocalEnv = location.protocol==="file:" || ["localhost","127.0.0.1","[::1]"].includes(location.hostname);
let mode = "online";
if(isLocalEnv){
 mode="local";
 try{const m=localStorage.getItem("portalMode");if(m==="online"||m==="local")mode=m}catch(e){}
}else $("#modes").hidden=true;          // en ligne : le bouton Local n'existe pas
let dirHandle = null;                 // dossier choisi (API File System Access, Chrome/Edge)
const localFiles = new Map();         // chemin relatif -> File
const blobCache = new Map();          // chemin relatif -> URL blob
const PICK_MSG = "Mode local : sélectionnez le dossier de votre site (celui qui contient vos matières). Les fichiers sont lus directement sur votre disque, rien n’est envoyé.";

function setNav(open){layout.classList.toggle("sidebar-collapsed",!open);toggleBtn.setAttribute("aria-expanded",String(open));}
function isHidden(p){return p.split("/").some(s=>s.startsWith(".")||s==="node_modules")}
function urlOf(file){
 if(mode==="local"&&localFiles.has(file.path)){
  if(!blobCache.has(file.path))blobCache.set(file.path,URL.createObjectURL(localFiles.get(file.path)));
  return blobCache.get(file.path);
 }
 return file.path;
}
function showWelcome(){
 $("#welcome").hidden=false;$("#viewer").hidden=true;$("#main").classList.remove("wide","app");$("#breadcrumb").hidden=true;
}
function resetView(){
 activePath=null;query="";$("#search").value="";
 showWelcome();
}
function updateModeButtons(){
 document.querySelectorAll(".modes button").forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on))});
}
function setMode(m){
 mode=m;try{localStorage.setItem("portalMode",m)}catch(e){}
 updateModeButtons();resetView();initializePortal();
}
async function onModeClick(m){
 if(m!==mode){setMode(m);return}
 if(m!=="local")return;
 /* re-clic sur « Local » : relit le dossier (ou redemande le dossier) */
 if(dirHandle){
  try{if(await dirHandle.requestPermission({mode:"read"})!=="granted")throw 0}
  catch(e){resetView();showPicker(PICK_MSG);return}
  resetView();await loadFromHandle();
 }else{resetView();showPicker(PICK_MSG)}
}

function allFiles(items,out=[]){items.forEach(x=>{if(x.type==="folder")allFiles(x.children,out);else out.push(x)});return out}
/* ---------- Navigation dans le menu : un seul dossier affiché à la fois ---------- */
let rootItem=null,cur=null,activePath=null,query="";
const pathIndex=new Map();
function indexTree(){
 pathIndex.clear();
 rootItem={name:"",type:"folder",path:"",children:courses,parent:null};
 const walk=(it,parent)=>{it.parent=parent;pathIndex.set((it.type==="folder"?"d:":"f:")+it.path,it);if(it.type==="folder")it.children.forEach(c=>walk(c,it))};
 courses.forEach(c=>walk(c,rootItem));
 cur=rootItem;
}
function navBtn(item,sub){
 const li=document.createElement("li"),btn=document.createElement("button");
 btn.type="button";btn._item=item;btn.title=item.name;
 btn.innerHTML=`<span class="ico">${icons[item.type]||"📄"}</span><span class="txt"><span class="label"></span>${sub?'<span class="sub"></span>':""}</span>`;
 btn.querySelector(".label").textContent=item.name;
 if(sub)btn.querySelector(".sub").textContent=sub;
 if(item.type!=="folder"&&item.path===activePath)btn.classList.add("active");
 btn.addEventListener("click",e=>item.type==="folder"?openFolder(item,e.detail===0?"first":null):openFile(item));
 btn.addEventListener("contextmenu",e=>showMenu(e,item));
 li.append(btn);return li;
}
function renderNav(focus){
 tree.replaceChildren();
 const q=query.trim().toLocaleLowerCase("fr"),ul=document.createElement("ul");
 if(q){                                             // recherche dans tout le site
  const hits=[];
  (function walk(it){it.children.forEach(c=>{if(c.name.toLocaleLowerCase("fr").includes(q))hits.push(c);if(c.type==="folder")walk(c)})})(rootItem);
  if(!hits.length){tree.textContent="Aucun résultat.";return}
  hits.forEach(h=>ul.append(navBtn(h,h.parent&&h.parent!==rootItem?h.parent.path:"")));
 }else{
  if(cur!==rootItem){
   const li=document.createElement("li"),b=document.createElement("button");
   b.type="button";b.className="parentbtn";
   b.innerHTML='<span class="ico">⬆</span><span class="txt"><span class="label">Dossier parent</span></span>';
   b.addEventListener("click",e=>openFolder(cur.parent,e.detail===0?cur:null));
   li.append(b);ul.append(li);
   const h=document.createElement("li");h.className="navhead";h.textContent=cur.name;h.title=cur.path;ul.append(h);
  }
  cur.children.forEach(c=>ul.append(navBtn(c)));
 }
 tree.append(ul);
 if(focus){
  const bs=[...tree.querySelectorAll("button")];
  const t=focus==="first"?(cur!==rootItem&&bs[1]?bs[1]:bs[0]):bs.find(b=>b._item===focus);
  if(t)t.focus();
 }
}
function applyHash(){
 let p="";try{p=decodeURIComponent(location.hash.slice(1))}catch(e){}
 if(!p)return;
 const d=pathIndex.get("d:"+p),f=pathIndex.get("f:"+p);
 if(d)openFolder(d);else if(f){openFolder(f.parent);openFile(f)}
}
/* Lecture d'un fichier texte : UTF-8 en priorité, repli sur Windows-1252 (accents des anciens .txt) */
async function fetchText(url){
 const r=await fetch(url);
 if(!r.ok)throw Error("Fichier introuvable");
 const buf=await r.arrayBuffer();
 try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}
 catch(e){return new TextDecoder("windows-1252").decode(buf)}
}

/* ---------- Téléchargements (fichier / dossier en .zip) ---------- */
function saveBlob(blob,name){
 const u=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=u;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),60000);
}
function downloadFile(file){
 const a=document.createElement("a");a.href=urlOf(file);a.download=file.name;document.body.append(a);a.click();a.remove();
}
let toastTimer;
function toast(msg,ms=2500){
 let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.append(t)}
 t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),ms);
}
async function downloadFolder(item,statusEl){
 const say=(t,ms)=>{if(statusEl)statusEl.textContent=t;else toast(t,ms)};
 if(!window.JSZip){say("Bibliothèque de compression indisponible (connexion internet requise).",4000);return}
 const files=allFiles(item.children);
 if(!files.length){say("Ce dossier est vide.");return}
 const root=(item.path||item.name).split("/").pop();
 const zip=new JSZip();let done=0,failed=0;
 const queue=[...files];
 const worker=async()=>{
  while(queue.length){
   const f=queue.shift();
   try{
    const r=await fetch(urlOf(f));if(!r.ok)throw Error();
    zip.file(root+"/"+f.path.slice(item.path.length+1),await r.arrayBuffer());
   }catch(e){failed++}
   say(`Préparation du zip… ${++done}/${files.length}`,60000);
  }
 };
 await Promise.all([worker(),worker(),worker(),worker()]);
 say("Compression…",60000);
 const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:3}});
 saveBlob(blob,root+".zip");
 say(failed?`Terminé (${failed} fichier(s) non lu(s)).`:"Téléchargement prêt.",4000);
}

/* ---------- Menu contextuel (clic droit dans l'arborescence) ---------- */
function openInNewTab(item){
 if(item.type==="folder"){window.open(location.href.split("#")[0]+"#"+encodeURIComponent(item.path),"_blank");return}
 if(item.type==="falstad"){
  const w=window.open("about:blank","_blank");if(w)w.opener=null;
  fetchText(urlOf(item)).then(t=>{if(w)w.location.href=falstadUrl(t,true)}).catch(()=>{if(w)w.close()});
  return;
 }
 if(item.type==="link"){
  const w=window.open("about:blank","_blank");if(w)w.opener=null;
  fetchText(urlOf(item)).then(t=>{const i=linkInfo(parseLink(t));if(i&&w)w.location.href=i.url;else if(w)w.close()}).catch(()=>{if(w)w.close()});
  return;
 }
 window.open(urlOf(item),"_blank");
}
function hideMenu(){const m=$("#ctxmenu");if(m)m.remove()}
function showMenu(e,item){
 e.preventDefault();hideMenu();
 const m=document.createElement("div");m.id="ctxmenu";m.className="ctxmenu";
 const add=(label,fn)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>{hideMenu();fn()};m.append(b)};
 if(item.type==="folder"){
  if(mode==="online")add("↗ Ouvrir dans un nouvel onglet",()=>openInNewTab(item));
  add("⬇ Télécharger le dossier (.zip)",()=>downloadFolder(item,null));
 }else{
  add("↗ Ouvrir dans un nouvel onglet",()=>openInNewTab(item));
  add("⬇ Télécharger le fichier",()=>downloadFile(item));
 }
 document.body.append(m);
 const r=m.getBoundingClientRect();
 m.style.left=Math.max(4,Math.min(e.clientX,innerWidth-r.width-6))+"px";
 m.style.top=Math.max(4,Math.min(e.clientY,innerHeight-r.height-6))+"px";
}
document.addEventListener("click",hideMenu);
addEventListener("keydown",e=>{if(e.key==="Escape")hideMenu()});
addEventListener("resize",hideMenu);
$("#sidebar").addEventListener("scroll",hideMenu);

/* ---------- Code source : coloration, numéros de lignes, indentation automatique ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CODE_LANGS={ino:"c",c:"c",h:"c",cpp:"c",hpp:"c",cc:"c",sh:"sh",bash:"sh",py:"py",cmd:"bat",bat:"bat"};
const VIDEO_EXT=["mp4","m4v","webm","ogv","mov"], LINK_EXT=["link","url"];
const langOf=path=>CODE_LANGS[path.split(".").pop().toLowerCase()];
const INDENT="  ";   // indentation automatique (C/C++/Arduino) : 2 espaces comme l'IDE Arduino
const HL={
 c:{flags:"gm",rules:[
  ["com",/\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|(?![\s\S]))/],
  ["pre",/^[ \t]*#(?:[^\n\\]|\\[\s\S])*/],
  ["str",/"(?:[^"\\\n]|\\[\s\S])*"?|'(?:[^'\\\n]|\\[\s\S])*'?/],
  ["num",/\b(?:0[xX][\da-fA-F']+|0[bB][01']+|\d[\d']*(?:\.\d*)?(?:[eE][+-]?\d+)?)[uUlLfF]*\b|\.\d+(?:[eE][+-]?\d+)?[fF]?\b/],
  ["kw",/\b(?:if|else|for|while|do|switch|case|default|break|continue|return|goto|struct|union|enum|typedef|sizeof|static|const|volatile|extern|inline|register|class|public|private|protected|virtual|template|typename|namespace|using|new|delete|this|operator|try|catch|throw|auto|constexpr|nullptr|true|false|explicit|friend|override|final|noexcept|mutable|asm)\b/],
  ["ty",/\b(?:void|int|char|short|long|float|double|signed|unsigned|bool|byte|word|boolean|size_t|String|string|wchar_t|FILE|u?int\d+_t)\b/],
  ["bi",/\b(?:HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|A\d+|PI|NULL|EOF|Serial\d?|Wire|SPI|setup|loop|main|pinMode|digitalWrite|digitalRead|analogRead|analogWrite|delay|delayMicroseconds|millis|micros|attachInterrupt|map|constrain|min|max|abs|printf|scanf|puts|putchar|getchar|malloc|free|memcpy|memset|strlen|strcpy|strcmp|sprintf)\b/],
  ["fn",/\b[A-Za-z_]\w*(?=\s*\()/]]},
 py:{flags:"gm",rules:[
  ["com",/#[^\n]*/],

function tokenize(src,lang){
 const L=HL[lang];
 if(!L.re)L.re=new RegExp(L.rules.map(r=>"("+r[1].source+")").join("|"),L.flags);
 const re=L.re,toks=[];let last=0,m;re.lastIndex=0;
 while((m=re.exec(src))){
  if(m[0]===""){re.lastIndex++;continue}
  if(m.index>last)toks.push([null,src.slice(last,m.index)]);
  toks.push([L.rules[m.findIndex((x,i)=>i>0&&x!==undefined)-1][0],m[0]]);
  last=re.lastIndex;
 }
 if(last<src.length)toks.push([null,src.slice(last)]);
 return toks;
}
function codeHtml(text,lang){
 const lines=[[]];
 for(const [c,t] of tokenize(text,lang))t.split("\n").forEach((part,i)=>{if(i)lines.push([]);if(part)lines[lines.length-1].push([c,part])});
 if(lines.length>1&&!lines[lines.length-1].length)lines.pop();
 return `<table class="code"><tbody>${lines.map((ln,i)=>`<tr><td class="ln">${i+1}</td><td class="lc">${ln.map(([c,p])=>c?`<span class="hl-${c}">${esc(p)}</span>`:esc(p)).join("")}</td></tr>`).join("")}</tbody></table>`;
}
/* Analyse d'une ligne C/C++ : accolades/parenthèses hors chaînes et commentaires */
function scanC(t){
 let plain="",db=0,dp=0,lead=0,leadP=false,saw=false,block=false;
 for(let i=0;i<t.length;i++){
  const c=t[i],n=t[i+1];
  if(c==="/"&&n==="/")break;
  if(c==="/"&&n==="*"){const j=t.indexOf("*/",i+2);if(j<0){block=true;break}i=j+1;continue}
  if(c==='"'||c==="'"){let j=i+1;while(j<t.length&&t[j]!==c){if(t[j]==="\\")j++;j++}plain+=c+c;i=j;saw=true;continue}
  if(c===" "||c==="\t"){plain+=c;continue}
  if(c==="}"){db--;if(!saw)lead++;plain+=c;continue}
  if(c===")"||c==="]"){dp--;if(!saw)leadP=true;saw=true;plain+=c;continue}
  saw=true;
  if(c==="{")db++;else if(c==="("||c==="[")dp++;
  plain+=c;
 }
 return {plain:plain.trim(),db,dp,lead,leadP,block};
}
/* Réindentation automatique (C, C++, Arduino) : accolades, case/default, parenthèses, if/for/else sans accolades */
function reindentC(src){
 const out=[],caseAt={},braceCase={};
 let depth=0,paren=0,inBlock=false,pending=0,ppCont=false,ctlOpen=false;
 /* décalage dû aux « case » ouverts (hors bloc { } ouvert sur la ligne du case) */
 const casesTo=(d,ref)=>{let n=0;for(const k in caseAt)if(caseAt[k]&&+k<=d&&!(braceCase[k]&&ref>+k))n++;return n};
 for(const raw of src.replace(/\r\n?/g,"\n").split("\n")){
  const t=raw.trim();
  if(!t){out.push("");continue}
  if(inBlock){
   out.push(t[0]==="*"?INDENT.repeat(depth+casesTo(depth,depth))+" "+t:raw.replace(/\s+$/,""));
   if(t.includes("*/"))inBlock=false;continue;
  }
  if(ppCont||t[0]==="#"){out.push(ppCont?INDENT+t:t);ppCont=t.endsWith("\\");continue}
  const s=scanC(t),closed=[];
  let d=depth;
  for(let k=0;k<s.lead;k++){delete caseAt[d];closed.push(d-1);d=Math.max(d-1,0)}
  const isCase=/^(?:case\b[^:]*|default\s*):(?!:)/.test(s.plain);
  const pe=Math.max(paren-(s.leadP?1:0),0)>0?1:0;
  let lvl;
  if(isCase){lvl=d+casesTo(d-1,depth);caseAt[d]=true;if(s.db>0)braceCase[d]=true}
  else lvl=d+casesTo(d,depth)+pe+(s.plain[0]==="{"?0:pending);
  out.push(INDENT.repeat(lvl)+t);
  closed.forEach(k=>{braceCase[k]=false});
  depth=Math.max(depth+s.db,0);paren=Math.max(paren+s.dp,0);inBlock=s.block;
  const startsCtl=/^(?:\}\s*)?(?:else\s+if|if|for|while|switch)\b/.test(s.plain);
  if(startsCtl&&paren>0)ctlOpen=true;
  const endsParen=/\)$/.test(s.plain)&&paren===0;
  const elseOnly=/^(?:\}\s*)?else$/.test(s.plain)||/^do$/.test(s.plain);
  if(((startsCtl||ctlOpen)&&endsParen&&s.db===0)||elseOnly){pending++;ctlOpen=false}
  else if(paren===0){pending=0;ctlOpen=false}
 }
 return out.join("\n");
}

const EMBED_HOSTS=["wokwi.com","falstad.com","geogebra.org","desmos.com","youtube-nocookie.com","player.vimeo.com"];

function ytStart(v){
 const m=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(v||"");
 return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0;
}
function linkInfo(raw){
 let u;try{u=new URL(raw)}catch(e){return null}
 if(!/^https?:$/.test(u.protocol))return null;
 const host=u.hostname.replace(/^www\./,"");
 const info={url:u.href,host,embed:null};
 let id=null;
 const list=u.searchParams.get("list");
 if(host==="youtu.be")id=u.pathname.slice(1).split("/")[0];
 else if(host==="youtube.com"||host.endsWith(".youtube.com")||host==="youtube-nocookie.com"){
  const m=/^\/(?:shorts|embed|live|v)\/([\w-]{6,})/.exec(u.pathname);
  id=m?m[1]:(u.pathname==="/watch"?u.searchParams.get("v"):null);
  if(!id&&list&&u.pathname==="/playlist"){info.embed="https://www.youtube-nocookie.com/embed/videoseries?list="+encodeURIComponent(list);return info}
 }
 if(id){
  const q=[],st=ytStart(u.searchParams.get("t")||u.searchParams.get("start"));
  if(st)q.push("start="+st);if(list)q.push("list="+encodeURIComponent(list));
  info.embed="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+(q.length?"?"+q.join("&"):"");
  return info;
 }
 const vm=host==="vimeo.com"&&/^\/(\d+)/.exec(u.pathname);
 if(vm){info.embed="https://player.vimeo.com/video/"+vm[1];return info}
 if(EMBED_HOSTS.some(h=>host===h||host.endsWith("."+h)))info.embed=u.href;
 return info;
}

function prettyName(s){
 s=s.replace(/_+/g,' ').replace(/(?<=\p{L})-(?=\p{L})/gu,' ').replace(/\s+/g,' ').trim();

}
function fileType(path){
 const ext=path.split('.').pop().toLowerCase();
 if(ext==='md'||ext==='markdown')return 'markdown';
 if(ext==='html'||ext==='htm')return 'html';
 if(ext==='pdf')return 'pdf';
 if(ext==='txt')return 'text';
 if(ext==='falstad')return 'falstad';
 if(ext==='odt')return 'odt';
 if(ext==='odp')return 'odp';
 if(CODE_LANGS[ext])return 'code';
 if(VIDEO_EXT.includes(ext))return 'video';
 if(LINK_EXT.includes(ext))return 'link';

}
function buildTree(paths){
 const root={children:new Map()};
 for(const path of paths){
  if(!path || isHidden(path) || path==='index.html' || path.toLowerCase()==='readme.md')continue;
  const parts=path.split('/'); let node=root;
  parts.forEach((part,i)=>{
   if(!node.children.has(part))node.children.set(part,{name:part,children:new Map(),path:null,full:parts.slice(0,i+1).join('/')});
   node=node.children.get(part);
   if(i===parts.length-1)node.path=path;
  });
 }
 function convert(node){
  return [...node.children.values()].sort((a,b)=>{
   const af=a.children.size>0||!a.path, bf=b.children.size>0||!b.path;
   return af===bf?a.name.localeCompare(b.name,'fr',{numeric:true}):(af?-1:1);
  }).map(item=>{
   if(item.children.size>0||!item.path)return {name:prettyName(item.name),type:'folder',path:item.full,children:convert(item)};
   const ty=fileType(item.path);
   return {name:ty==='link'?item.name.replace(/\.[^.]+$/,''):item.name,type:ty,path:item.path,lang:langOf(item.path)};
  });
 }
 return convert(root);
}

/* ---------- Mode en ligne : API GitHub ---------- */
async function discoverRepositoryFiles(){
 const host=location.hostname;
 const owner=repoOwner || host.split('.')[0];
 let repo=repoName;
 if(!repo){
  if(host.endsWith('.github.io')) repo=location.pathname.split('/').filter(Boolean)[0] || (owner+'.github.io');
  else throw new Error('Dépôt introuvable automatiquement. Renseignez repoOwner et repoName dans index.html.');
 }
 const infoResponse=await fetch(`https://api.github.com/repos/${owner}/${repo}`);
 if(!infoResponse.ok)throw new Error('Impossible d’accéder au dépôt GitHub. Vérifiez que le dépôt est public et que son nom est correct.');
 const info=await infoResponse.json();
 const treeResponse=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(info.default_branch)}?recursive=1`);
 if(!treeResponse.ok)throw new Error('GitHub n’a pas pu lire l’arborescence du dépôt.');
 const data=await treeResponse.json();
 if(data.truncated)throw new Error('Le dépôt contient trop de fichiers pour une lecture complète via l’API GitHub.');
 return (data.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);
}

async function scanDir(handle,prefix="",out=[]){
 for await(const [name,h] of handle.entries()){
  if(isHidden(name))continue;                       // ignore .git, node_modules…
  if(h.kind==="directory")await scanDir(h,prefix+name+"/",out);
  else out.push([prefix+name,await h.getFile()]);
 }
 return out;
}

  try{dirHandle=await showDirectoryPicker({mode:"read"})}
  catch(e){if(e&&e.name==="AbortError")return;dirHandle=null;$("#folderInput").click();return}
  await loadFromHandle();
 }else $("#folderInput").click();
}
$("#folderInput").addEventListener("change",e=>{
 const files=[...e.target.files];e.target.value="";
 if(!files.length)return;
 dirHandle=null;
 applyLocalFiles(files.map(f=>{const parts=(f.webkitRelativePath||f.name).split("/");parts.shift();return [parts.join("/"),f]}));
});
function showPicker(msg){
 rootItem=null;tree.replaceChildren();
 const box=document.createElement("div");box.className="pickbox";
 const p=document.createElement("p");p.className="notice";p.textContent=msg;
 const b=document.createElement("button");b.type="button";b.className="btn primary";b.textContent="📂 Choisir le dossier du site";
 b.addEventListener("click",chooseFolder);
 box.append(p,b);tree.append(box);
}

/* ---------- Initialisation ---------- */
async function initializePortal(){
 if(mode==="local"){
  if(dirHandle)await loadFromHandle();
  else if(localFiles.size)applyLocalFiles([...localFiles.entries()]);
  else showPicker(PICK_MSG);
  return;
 }
 rootItem=null;tree.replaceChildren();
 const status=document.createElement('p');status.className='notice';status.textContent='Détection des dossiers et fichiers du dépôt…';tree.append(status);
 try{
  const paths=await discoverRepositoryFiles();
  if(mode!=="online")return;                         // changement de mode pendant le chargement
  if(showTree(paths,'Aucun document trouvé dans les sous-dossiers du dépôt.'))applyHash();
 }catch(error){
  status.textContent=error.message+' Vous pouvez aussi vérifier les paramètres du dépôt dans index.html.';
 }
}

document.querySelectorAll(".modes button").forEach(b=>b.addEventListener("click",()=>onModeClick(b.dataset.mode)));
$("#search").addEventListener("input",e=>{query=e.target.value;if(rootItem)renderNav()});
$("#search").addEventListener("keydown",e=>{
 if(e.key==="ArrowDown"){const b=tree.querySelector("button");if(b){e.preventDefault();b.focus()}}
});
/* Flèches haut/bas dans le menu ; Entrée (clic natif du bouton) ouvre le fichier ou entre dans le dossier */
tree.addEventListener("keydown",e=>{
 if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
 const bs=[...tree.querySelectorAll("button")],i=bs.indexOf(document.activeElement);
 if(i<0)return;e.preventDefault();
 if(e.key==="ArrowDown")bs[Math.min(i+1,bs.length-1)].focus();
 else if(i>0)bs[i-1].focus();else $("#search").focus();
});
toggleBtn.addEventListener("click",()=>setNav(layout.classList.contains("sidebar-collapsed")));

/* ---------- Largeur du menu réglable à la souris ---------- */
const resizer=$("#resizer"),sidebar=$("#sidebar");
try{const w=+localStorage.getItem("portalSide");if(w>=180&&w<=900)layout.style.setProperty("--side",w+"px")}catch(e){}
resizer.addEventListener("pointerdown",e=>{resizer.setPointerCapture(e.pointerId);resizer.classList.add("drag");document.body.style.userSelect="none"});
resizer.addEventListener("pointermove",e=>{
 if(!resizer.classList.contains("drag"))return;
 const w=Math.max(180,Math.min(e.clientX-layout.getBoundingClientRect().left,Math.round(innerWidth*0.6)));
 layout.style.setProperty("--side",w+"px");
});
const endDrag=()=>{
 if(!resizer.classList.contains("drag"))return;
 resizer.classList.remove("drag");document.body.style.userSelect="";
 try{localStorage.setItem("portalSide",Math.round(sidebar.getBoundingClientRect().width))}catch(e){}
};
resizer.addEventListener("pointerup",endDrag);resizer.addEventListener("pointercancel",endDrag);
resizer.addEventListener("dblclick",()=>{layout.style.removeProperty("--side");try{localStorage.removeItem("portalSide")}catch(e){}});

updateModeButtons();
initializePortal();
</script>
</body>
</html>
