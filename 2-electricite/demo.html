<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loi d'Ohm</title><style>body{font:16px system-ui;padding:24px;color:#243247}input,button{padding:9px;font:inherit;margin:5px}#out{padding:12px;background:#eef5ff;border-radius:8px}</style><h1>Calculateur — loi d'Ohm</h1><label>Résistance (Ω) <input id="r" type="number" value="100"></label><br><label>Intensité (A) <input id="i" type="number" value="0.2" step="0.01"></label><br><button onclick="calc()">Calculer U</button><p id="out">Tension : 20 V</p><script>function calc(){let r=Number(document.querySelector('#r').value),i=Number(document.querySelector('#i').value);document.querySelector('#out').textContent=Number.isFinite(r*i)?'Tension : '+(r*i)+' V':'Valeurs invalides'}</script></html>
